packages:
  - "apps/*"
  - "packages/*"

# 네이티브 빌드 스크립트 허용 목록 — pnpm 은 기본적으로 전부 막는다.
#   esbuild        : tsx(서버 dev watch) 와 eslint 가 쓴다
#   unrs-resolver  : eslint-config-next 의 resolver
allowBuilds:
  esbuild: true
  unrs-resolver: true

# pnpm 은 갓 배포된 버전을 기본적으로 보류한다(공급망 공격 완화 — 악성 버전은 보통
# 배포 직후 짧게 살아있다). 아래는 그 유예를 면제한 항목이다. 새 줄을 추가할 때는
# 정말 지금 필요한 버전인지 한 번 보고 넣을 것.
minimumReleaseAgeExclude:
  - lucide-react@1.43.0
