# 로컬 개발용 Postgres.
#
# 배포 대상은 아직 정하지 않았다(헌장 스택 절). 이건 개발용이고, 프로덕션 DB 를
# 흉내내지 않는다 — 목적은 `pnpm db:migrate` 와 기억 기능을 손에서 돌리는 것뿐이다.
#
# pgvector 가 포함된 이미지를 쓴다. 관리형 Postgres 는 확장을 미리 켜주지만
# 맨 Postgres 는 그렇지 않고, 첫 마이그레이션(0000)이 `vector(1024)` 컬럼을 만들기
# 때문에 확장이 **그보다 먼저** 있어야 한다. docker/postgres-init 이 그 일을 한다.

services:
  postgres:
    # pg 버전은 관리형 쪽과 맞춰두면 나중에 옮길 때 놀랄 일이 줄어든다.
    image: pgvector/pgvector:pg17
    container_name: navis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: navis
      POSTGRES_PASSWORD: navis
      POSTGRES_DB: navis
      # 로컬 전용이라 비밀번호가 약해도 된다. 대신 포트를 루프백에만 노출한다(아래).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 127.0.0.1 로 묶는다 — 0.0.0.0 으로 열면 같은 네트워크의 다른 기기에서 붙는다.
      - "127.0.0.1:5432:5432"
    volumes:
      - navis-pgdata:/var/lib/postgresql/data
      # 이 디렉터리의 .sql 은 **데이터 디렉터리가 빈 경우에만** 한 번 실행된다.
      # 이미 초기화된 볼륨에는 적용되지 않는다 — 바꿨으면 볼륨을 지워야 한다.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready 는 "접속 가능" 까지만 본다. 초기화 스크립트 완료를 확인하려면
      # 확장이 실제로 있는지 물어야 한다.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U navis -d navis && psql -U navis -d navis -tAc \"select 1 from pg_extension where extname='vector'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  navis-pgdata:
    name: navis-pgdata
