# navis 자기 개선 워크플로 — "코드 수정 서브에이전트"
#
# 동작:
#   1. navis 봇이 디스코드에서 "이거 고쳐줘" 명령을 받으면 GitHub
#      repository_dispatch (type: self-improve)를 던진다.
#   2. 이 워크플로가 새 브랜치 체크아웃 → Claude Code CLI(Opus 4.7)로
#      자연어 지시를 실행해 코드를 수정 → 빌드/타입체크 통과 검증 → 커밋 → PR 생성.
#   3. 빌드 게이트를 통과한 PR 은 그 자리에서 squash 자동 머지(사람 검토 불필요).
#      PR 생성/머지 이벤트는 webhook → navis 봇 → 기록/리포트로 전달.
#
# 안전장치: '변경 없음'(환각·빈 PR)은 commit 단계 exit 1 로 차단, 빌드/타입체크
#   실패는 PR 생성 전에 job 을 죽이므로, 자동 머지는 '게이트 통과한 변경'에만 적용된다.
#
# 인증:
#   - GITHUB_TOKEN: workflow-scoped (자동 제공, 별도 secret 불필요).
#     contents:write + pull-requests:write 권한을 permissions 블록으로 부여.

name: navis self-improve

on:
  repository_dispatch:
    types: [self-improve]

permissions:
  contents: write
  pull-requests: write

# 동시 self-improve 트리거 중복 방지 (instruction 별로 격리는 안 함 — 단순화).
concurrency:
  group: self-improve-${{ github.event.client_payload.dispatch_id }}
  cancel-in-progress: false

jobs:
  modify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      INSTRUCTION: ${{ github.event.client_payload.instruction }}
      CHANNEL_ID: ${{ github.event.client_payload.channel_id }}
      DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
    steps:
      - name: 입력 검증
        run: |
          if [ -z "$INSTRUCTION" ]; then
            echo "::error::client_payload.instruction 비어있음 — dispatch 페이로드 확인"
            exit 1
          fi
          echo "instruction(len=${#INSTRUCTION}): ${INSTRUCTION:0:200}..."
          echo "channel=$CHANNEL_ID dispatch=$DISPATCH_ID"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git identity
        run: |
          git config user.name "navis-bot"
          git config user.email "navis-bot@users.noreply.github.com"

      - name: 새 브랜치 생성
        id: branch
        run: |
          # 디스패치 id가 있으면 그걸로, 없으면 타임스탬프로.
          slug="${DISPATCH_ID:-$(date +%Y%m%d-%H%M%S)}"
          branch="navis/self-improve/$slug"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Node 22 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.0.8 --activate

      - name: Claude Code CLI 설치
        # 공식 native installer. 단일 바이너리로 ~/.local/bin/claude 설치.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 의존성 설치 (수정 후 빌드 검증용)
        run: pnpm install --frozen-lockfile

      - name: Claude 로 코드 수정 실행
        env:
          # CLI 가 OAuth 토큰을 env 에서 자동 사용.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # 변경 가능 경로를 시스템 프롬프트로 제한.
          # 도구 화이트리스트는 코드 수정에 필요한 최소 집합만.
          PROMPT=$(cat <<EOF
          [작업 지시 — 사용자가 디스코드에서 navis 에게 요청한 것]

          ${INSTRUCTION}

          [제약]
          - 변경 허용 경로: packages/** (모든 패키지의 소스·문서 — navis, namory, app, desktop 등 전부)와 루트 README.md
          - 절대 금지: .github/**, **/*.lock, pnpm-lock.yaml, .env*, 루트 package.json, 루트 pnpm-workspace.yaml
          - 빌드 설정 파일(각 패키지의 Dockerfile, package.json, app.json 등)은 꼭 필요할 때만 신중히 수정
          - 수정 후 반드시 'pnpm -r build' 와 'pnpm -r typecheck' 가 성공해야 함 — 깨지면 본인이 고쳐서 통과시킬 것
          - 변경 사유를 짧게 commit message 본문에 남길 것

          [실행 모드 — 중요]
          - 이 환경은 headless(\`claude -p\`)다. 사용자가 답할 수 없다. 어떤 경우에도 "어느 쪽으로 가야 할까요?" 같은 질문을 던지지 말 것.
          - 요청과 제약이 충돌하면 다음 순서로 스스로 결정:
            1) 제약 안에서 사용자 의도에 가장 가까운 해석이 가능하면 그걸로 실행 (예: 루트 외 다른 README 경로로 대체).
            2) 어떤 해석으로도 불가능하면 파일을 절대 수정하지 말고, 거절 사유와 권장 대체안을 표준 출력에 한 단락으로 적고 종료. 워크플로가 "변경 없음" 으로 실패하면서 그 출력으로 사용자가 원인 파악.
          - 결정 즉시 도구 호출로 실행에 들어갈 것. 사용자 확인을 기다리는 출력을 하지 말 것.

          [환각 방지 — 절대 규칙 (5/28 사고 재발 방지)]
          - 도구 호출 0회 상태에서 "완료/수정/적용했습니다" 같은 텍스트만 출력하는 것은 절대 금지. 실제 파일 변경은 오직 Edit/Write 도구 호출로만 일어난다. 머릿속 시뮬레이션은 디스크에 닿지 않는다.
          - 커밋·SHA·PR 은 워크플로(GitHub Actions)가 너의 변경을 받아서 만든다. 너는 절대 git commit 을 하지 않고, "커밋 abc1234 로 남겼습니다" 같은 가짜 SHA 도 출력하지 않는다.
          - 자기 검증 마지막 단계 (필수): 모든 Edit/Write 후 마지막에 Bash 로 \`git status --short\` 를 호출한다.
              · 출력이 비어 있으면 → 도구 호출이 디스크에 반영되지 않은 것. 다시 Edit/Write 로 시도.
              · 출력에 파일이 보이면 → 그 파일명을 그대로 적어 한 줄 요약 후 종료(예: "변경: packages/navis/src/config.ts").
          - 거절 경로(요청 불가능)로 종료할 때도 \`git status --short\` 를 호출해 빈 상태인지 본인이 확인할 것.
          EOF
          )

          echo "::group::claude 호출 직전 git status"
          git status --short
          echo "::endgroup::"

          # --permission-mode bypassPermissions: headless 환경에서 모든 도구 호출을 자동
          #   승인. acceptEdits 는 편집만 자동이라 Bash/Glob 등에서 권한 막혀 changed=false
          #   로 빠질 수 있었음(5/28 버그). 변경 가능 경로는 위 [제약] 블록과 빌드 검증으로
          #   격리되니, 워크플로 안에서 권한은 풀어도 안전.
          # Bash(*) : CLI 가 인식하는 패턴 형식(parens 필수).
          # --verbose : 실패 원인 추적을 위해 도구 호출 로그를 stdout 에 남김.
          set -x
          claude -p "$PROMPT" \
            --model claude-opus-4-7 \
            --max-turns 60 \
            --permission-mode bypassPermissions \
            --allowed-tools "Read Write Edit Glob Grep Bash(*)" \
            --verbose
          set +x

          echo "::group::claude 호출 직후 git status"
          git status --short
          echo "::endgroup::"

      - name: 빌드 통과 검증
        # app/desktop 등 build 스크립트가 없는 패키지는 typecheck 로 검증(pnpm -r 은
        # 해당 스크립트가 있는 패키지에서만 실행 → 없는 곳은 건너뜀).
        run: |
          pnpm -r build
          pnpm -r typecheck

      - name: 변경 사항 커밋
        id: commit
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            # Claude 가 아무것도 수정하지 않은 경우 — 디버깅에 유용하도록 명시적 실패로
            # 처리한다. 이전엔 warning 후 changed=false 로 빠져 디스코드에선 "전송 성공" 만
            # 보이고 PR 이 없는 상태가 됐다(5/28 버그). 실패 시 Actions 로그를 보면
            # claude 단계 출력으로 원인을 추적할 수 있다.
            echo "::error::변경 사항 없음 — Claude 가 아무것도 수정하지 않음. 위 'claude 호출 직전/직후 git status' 와 claude 출력으로 원인 추적할 것."
            exit 1
          fi
          git add -A
          # 첫 줄 80자 + 본문에 instruction.
          short=$(echo "$INSTRUCTION" | head -c 70)
          git commit -m "navis self-improve: $short" -m "$INSTRUCTION"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: PR 생성 + 자동 머지
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 머지 전 최신 main 으로 리베이스 (반복 충돌 방지).
          #   이 잡이 도는 동안 다른 self-improve PR 이 main 에 먼저 머지되면 이 브랜치가
          #   stale 해져, 마지막 squash 머지가 충돌로 실패한다(과거 PR #61 반복 충돌 원인).
          #   분기 이후 main 이 전진했을 때만 리베이스하고, 코드가 새로 합쳐졌으니 빌드를
          #   재검증한다. 같은 라인 충돌은 자동 해소하지 않고 abort 후 명확히 실패시켜 사람이 본다.
          git fetch origin "+main:refs/remotes/origin/main"
          base=$(git merge-base HEAD origin/main)
          head_main=$(git rev-parse origin/main)
          if [ "$base" != "$head_main" ]; then
            echo "main 이 분기 이후 전진함 — origin/main 으로 리베이스 시도"
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::origin/main 리베이스 충돌 — 동일 코드를 동시 수정한 PR 과 충돌. 이 잡은 PR 을 만들지 않고 종료한다. Actions 로그의 위 git 출력으로 충돌 파일을 확인하고, 같은 지시를 다시 dispatch 하거나 수동으로 처리할 것."
              exit 1
            fi
            echo "리베이스 후 빌드 재검증 (의미적 충돌로 빌드가 깨지지 않는지 확인)"
            # 리베이스로 main 의 코드가 들어왔으니 의존성도 최신 lock 기준으로 다시 맞춘다
            # (다른 PR 이 pnpm-lock.yaml 을 바꿨을 수 있다 — frozen 이라 lock 변동 없으면 거의 무비용).
            pnpm install --frozen-lockfile
            pnpm -r build
            pnpm -r typecheck
          fi
          git push origin "${{ steps.branch.outputs.branch }}"
          # PR body 에 메타데이터 박음 — webhook 받을 때 channelId 복구용.
          pr_url=$(gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "navis self-improve: $(echo "$INSTRUCTION" | head -c 60)" \
            --body "$(cat <<EOF
          ## 작업 지시
          \`\`\`
          ${INSTRUCTION}
          \`\`\`

          ## 메타
          - dispatch_id: \`${DISPATCH_ID}\`
          - channel_id: \`${CHANNEL_ID}\`
          - actor: navis self-improve (Opus 4.7)

          빌드(pnpm -r build) + 타입체크 통과 확인 후 자동 머지됨.
          EOF
          )")
          echo "PR: $pr_url"

          # 자동 머지 — 검토/머지를 사람이 손으로 하지 않도록 바로 main 에 합친다.
          #   안전 근거: 이 잡은 PR 생성 *전에* '빌드 통과 검증'(pnpm -r build + typecheck)을
          #   하드 게이트로 통과해야만 여기 도달한다(실패 시 job 종료). 또 '변경 사항 없음'은
          #   commit 단계에서 exit 1 로 걸러진다(환각/빈 PR 방지).
          #   이 repo 는 브랜치 보호가 없고 allow_auto_merge=false 라 --auto 는 못 쓰므로,
          #   필수 체크가 없는 상태에서 즉시 squash 머지한다(= "체크 통과 후 머지"와 동일).
          #   push 직후 mergeable 상태 계산에 잠깐 지연이 있을 수 있어 몇 번 재시도.
          for i in 1 2 3 4 5; do
            if gh pr merge "$pr_url" --squash --delete-branch; then
              echo "✅ 자동 머지 완료 — $pr_url"
              exit 0
            fi
            echo "머지 재시도 $i/5 …"
            sleep 5
          done
          echo "::error::자동 머지 실패 — PR 은 생성됨($pr_url). 수동 머지 필요."
          exit 1
