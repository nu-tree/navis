# navis 데스크톱 릴리스 — 맥/윈도우 설치파일을 navis(Railway)로 게시.
#
# 동작:
#   - `desktop-v*` 태그를 push 하거나 수동 실행(workflow_dispatch)하면
#   - macOS / Windows 러너에서 각각 .dmg / .exe 를 빌드하고(electron-builder --publish never)
#   - 빌드 산출물(.dmg/.exe + latest*.yml + blockmap)을 navis 의
#     PUT /api/desktop/upload 로 업로드한다.
#
# 결과:
#   - 다운로드 페이지: https://<navis-url>/download  (토큰 로그인 후 설치파일 받기)
#   - 설치된 앱은 electron-updater(generic provider)로 navis 를 보고 자동 업데이트.
#
# 인증: GitHub PAT/공개 레포 불필요. navis 토큰(EXPO_PUBLIC_NAVIS_TOKEN == navis 의
# APP_API_TOKEN)으로 업로드·다운로드·자동업데이트를 모두 처리한다.
# 필요한 repo secret: EXPO_PUBLIC_NAVIS_URL, EXPO_PUBLIC_NAVIS_TOKEN.

name: desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 설치된 앱이 navis 를 보도록 자동업데이트 설정을 구워 넣는다(url + token).
      - name: Write updater config
        working-directory: packages/desktop
        env:
          NAVIS_URL: ${{ secrets.EXPO_PUBLIC_NAVIS_URL }}
          NAVIS_TOKEN: ${{ secrets.EXPO_PUBLIC_NAVIS_TOKEN }}
        run: node -e "require('fs').writeFileSync('updater-config.json', JSON.stringify({url:(process.env.NAVIS_URL||'').replace(/\/+$/,'')+'/api/desktop/file', token:process.env.NAVIS_TOKEN||''}))"

      - name: Build desktop (no publish)
        working-directory: packages/desktop
        env:
          # mac 코드서명 건너뜀(개인 배포 — 미서명 dmg)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 백엔드 주소를 웹 빌드에 인라인 (미설정이면 앱이 목업 폴백)
          EXPO_PUBLIC_NAVIS_URL: ${{ secrets.EXPO_PUBLIC_NAVIS_URL }}
          EXPO_PUBLIC_NAVIS_TOKEN: ${{ secrets.EXPO_PUBLIC_NAVIS_TOKEN }}
        run: pnpm web:build && npx electron-builder --publish never

      - name: Upload to navis
        working-directory: packages/desktop
        env:
          NAVIS_URL: ${{ secrets.EXPO_PUBLIC_NAVIS_URL }}
          NAVIS_TOKEN: ${{ secrets.EXPO_PUBLIC_NAVIS_TOKEN }}
        run: node scripts/upload.mjs
